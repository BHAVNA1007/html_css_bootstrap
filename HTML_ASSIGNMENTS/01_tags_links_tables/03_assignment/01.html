Algebra
Geometry
Science:

Chemistry

Use appropriate HTML tags to create the nested structure.
 -->

 <head>

 </head>
 <body>
      <ol>
        <li>Mathematics:</li>
             <ul>
                <li>Algebra</li>

            <ul>
                <li>Physics</li>
                <li>Chemistry</li>
            </ul>
        <li>Arts:</li> 
            <ul>
                <li>Painting</li>
                <li>Music</li>
            </ul>
            
      </ol>
 </body>
 </html>
